# Entorno Conda del proyecto LanzaroteTracker.
# Parte del entorno de la asignatura Vision por Ordenador I y solo anade
# lo imprescindible: yt-dlp, requests y pytest.
#
#   conda env create -f environment.yml
#   conda activate lanzarote-tracker
#   pip install -e .
name: lanzarote-tracker
channels:
  - conda-forge
dependencies:
  - python=3.9.21
  - numpy=1.26.0
  - scikit-image=0.24.0
  - imageio=2.36.1
  - matplotlib=3.9
  - scikit-learn
  - pandas
  - tqdm
  - jupyter
  - pip
  - pip:
      # OpenCV se instala por pip para fijar exactamente la version de la asignatura.
      # NO anadir opencv-contrib-python: la asignatura trabaja con el paquete base.
      - opencv-python==4.8.0.76
      - yt-dlp
      - requests
      - pytest
      # --- Deep learning: fuera del entorno base ------------------------------
      # El profesor ha APROBADO el uso de deep learning, pero el proyecto sigue
      # siendo de vision por ordenador tradicional: los backends por defecto son
      # `classic` (deteccion) y `bow` (clasificacion), que no necesitan nada de
      # esto. Los backends `coco` y `cnn` son alternativas OPCIONALES con las
      # que comparar en el informe.
      #
      # Por eso torch y torchvision NO se instalan aqui, para que este entorno
      # siga siendo el de la asignatura. Cuando hagan falta:
      #
      #     pip install -e ".[dl]"
      #
      # (ver el extra `dl` de pyproject.toml).
