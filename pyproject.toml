[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lanzarote-tracker"
version = "0.1.0"
description = "Seguimiento e identificacion de aviones en el aeropuerto de Lanzarote (ACE/GCRR)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Javier Martinez Montelongo" },
    { name = "Jaime Tuesta de Simon" },
]
# Las versiones exactas viven en environment.yml / requirements.txt.
# Aqui solo se declaran las dependencias para que `pip install -e .` funcione.
dependencies = [
    "opencv-python",
    "numpy",
    "scikit-image",
    "imageio",
    "matplotlib",
    "scikit-learn",
    "pandas",
    "tqdm",
    "yt-dlp",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
